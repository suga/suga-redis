# Solta uma versão para as duas plataformas a partir de uma tag.
#
# `npm run versao 0.2.0` lá no redis-desk cria a tag e empurra; o resto
# acontece aqui. Mac e Linux são compilados em máquinas diferentes porque
# têm que ser: não existe compilar um aplicativo de mesa de macOS fora de um
# Mac, e o Linux construído num Mac sairia na arquitetura errada (arm64,
# enquanto quase todo dev Linux está em x86_64).
#
# O pacote do Mac é universal — um .dmg só que roda em Apple Silicon e em
# Intel. Vale os minutos a mais de compilação: a alternativa é alguém baixar
# o arquivo errado e achar que o programa está quebrado.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  construir:
    permissions:
      contents: write

    strategy:
      # Sem `fail-fast`: se o Linux quebrar, o pacote do Mac ainda sai, e
      # dá para olhar os dois erros de uma vez em vez de um por rodada.
      fail-fast: false
      matrix:
        include:
          - plataforma: macos-latest
            args: "--target universal-apple-darwin"
            alvos: "aarch64-apple-darwin,x86_64-apple-darwin"
          - plataforma: ubuntu-22.04
            args: ""
            alvos: ""

    runs-on: ${{ matrix.plataforma }}

    steps:
      - uses: actions/checkout@v4

      # 22.04 e não a mais nova: o AppImage carrega consigo o que foi
      # compilado contra, e o que sai de um Ubuntu novo exige uma glibc que
      # distribuições mais antigas não têm. Compilar no mais velho que ainda
      # tem webkit2gtk-4.1 é o que faz o pacote rodar em mais lugares.
      - name: dependências do sistema (linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            patchelf build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: redis-desk/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvos }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: redis-desk/src-tauri -> target
          key: ${{ matrix.plataforma }}

      - name: instalar dependências
        working-directory: redis-desk
        run: npm ci

      # Os testes rodam antes de empacotar: uma versão que não passa nos
      # próprios testes não deveria chegar à máquina de ninguém.
      - name: testes
        working-directory: redis-desk
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A chave que assina o pacote de atualização. Vive só nos Secrets
          # do repositório; nenhum arquivo versionado a contém. Sem ela o
          # app recusa o que baixar, que é exatamente o ponto.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: redis-desk
          tagName: ${{ github.ref_name }}
          releaseName: "Suga-Redis __VERSION__"
          releaseBody: |
            Instalação e primeira abertura: veja o README.

            Quem já tem o app instalado não precisa baixar nada: ele avisa
            sozinho na próxima vez que abrir.
          # Publicada, não rascunho: o updater procura o `latest.json` da
          # release mais recente, e um rascunho não é visível para ele.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
